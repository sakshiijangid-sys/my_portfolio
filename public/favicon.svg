<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Elegant Velvet Maroon Gradients -->
    <linearGradient id="maroonHexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C2D40" />
      <stop offset="50%" stop-color="#6B1D2F" />
      <stop offset="100%" stop-color="#4A101E" />
    </linearGradient>

    <linearGradient id="maroonHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B33852" />
      <stop offset="100%" stop-color="#6B1D2F" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="hexShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2D0B13" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Clean Warm Background Canvas -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="#FDFBF7" stroke="#E5DFD5" stroke-width="4" />

  <!-- ISOMETRIC HEXAGON 'SJ' LOGO IN RICH MAROON -->
  <g filter="url(#hexShadow)">
    
    <!-- LETTER 'S' (Pillar & Slanted Parallel Hexagonal Bands) -->
    <!-- S Top Bar & Upper Loop -->
    <path 
      d="M 120 180 
         L 256 102 
         L 326 142 
         L 276 171 
         L 256 160 
         L 170 210 
         L 170 262 
         L 326 172 
         L 326 288 
         L 256 328 
         L 206 299 
         L 256 270 
         L 276 282 
         L 276 220 
         L 120 310 
         Z" 
      fill="url(#maroonHexGrad)" 
    />

    <!-- S Top Roof Facet (3D Top Accent) -->
    <path 
      d="M 120 180 
         L 256 102 
         L 326 142 
         L 276 171 
         L 256 160 
         L 170 210 
         Z" 
      fill="url(#maroonHighlight)" 
      opacity="0.95"
    />

    <!-- LETTER 'J' (Dot Block & Bottom Isometric Slant Hook) -->
    <!-- J Top-Right Diamond/Square Dot -->
    <path 
      d="M 356 159 
         L 406 188 
         L 406 238 
         L 356 209 
         Z" 
      fill="url(#maroonHighlight)" 
    />

    <!-- J Vertical Stem & Bottom Isometric Sweep -->
    <path 
      d="M 356 228 
         L 406 257 
         L 406 332 
         L 256 418 
         L 206 389 
         L 356 303 
         Z" 
      fill="url(#maroonHexGrad)" 
    />

  </g>
</svg>

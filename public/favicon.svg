<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Maroon Velvet Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D0B13" />
      <stop offset="50%" stop-color="#1A0409" />
      <stop offset="100%" stop-color="#0E0205" />
    </linearGradient>

    <!-- Warm Gold Accent Gradient for the S & J Monogram -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D2A4" />
      <stop offset="35%" stop-color="#E07A5F" />
      <stop offset="70%" stop-color="#8C2D40" />
      <stop offset="100%" stop-color="#6B1D2F" />
    </linearGradient>

    <!-- Maroon Rose Monogram Fill -->
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C83A54" />
      <stop offset="50%" stop-color="#8C2D40" />
      <stop offset="100%" stop-color="#540F1D" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="monogramShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="#6B1D2F" stroke-width="8" filter="url(#monogramShadow)" />

  <!-- Geometric Accent Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.35" stroke-dasharray="12 8" />

  <!-- INTERLOCKING S & J MONOGRAM LOGO -->
  <g filter="url(#monogramShadow)" transform="translate(0, 4)">
    <!-- THE "J" LETTER (Sweeping left to right hook behind S) -->
    <path 
      d="M 310 140 
         L 310 320 
         C 310 395 245 425 185 415 
         C 135 405 105 370 100 325 
         L 155 320 
         C 160 345 178 365 210 368 
         C 240 370 255 350 255 320 
         L 255 140 
         Z" 
      fill="url(#goldGrad)" 
      opacity="0.95"
    />

    <!-- THE "S" LETTER (Fluid Serpent Loop weaving through J) -->
    <path 
      d="M 335 185 
         C 320 135 265 110 200 120 
         C 135 130 105 175 115 220 
         C 125 265 170 280 230 295 
         C 290 310 325 330 315 380 
         C 305 430 240 450 170 440 
         C 115 432 80 395 70 345 
         L 125 335 
         C 132 365 158 388 200 392 
         C 240 396 262 380 265 355 
         C 270 325 235 310 175 295 
         C 115 280 65 255 75 195 
         C 88 130 155 95 235 90 
         C 295 85 340 115 355 165 
         Z" 
      fill="url(#maroonGrad)" 
      stroke="url(#goldGrad)" 
      stroke-width="4"
    />

    <!-- Interlocking Cut Accent Highlights -->
    <path d="M 255 200 L 255 260" stroke="#F2D2A4" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <circle cx="310" cy="120" r="14" fill="url(#goldGrad)" />
  </g>
</svg>

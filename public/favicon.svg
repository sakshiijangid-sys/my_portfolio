<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Velvet Color Gradients -->
    <radialGradient id="knotGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#BA334C"/>
      <stop offset="40%" stop-color="#801C2F"/>
      <stop offset="85%" stop-color="#4C0A17"/>
      <stop offset="100%" stop-color="#2B030A"/>
    </radialGradient>

    <linearGradient id="mainLoopLeft" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#C83A54"/>
      <stop offset="25%" stop-color="#9E2239"/>
      <stop offset="65%" stop-color="#601020"/>
      <stop offset="100%" stop-color="#33040C"/>
    </linearGradient>

    <linearGradient id="mainLoopRight" x1="90%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#C83A54"/>
      <stop offset="25%" stop-color="#9E2239"/>
      <stop offset="65%" stop-color="#601020"/>
      <stop offset="100%" stop-color="#33040C"/>
    </linearGradient>

    <linearGradient id="backLoopLeft" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#8E1F33"/>
      <stop offset="50%" stop-color="#550D1A"/>
      <stop offset="100%" stop-color="#240208"/>
    </linearGradient>

    <linearGradient id="backLoopRight" x1="100%" y1="10%" x2="0%" y2="90%">
      <stop offset="0%" stop-color="#8E1F33"/>
      <stop offset="50%" stop-color="#550D1A"/>
      <stop offset="100%" stop-color="#240208"/>
    </linearGradient>

    <linearGradient id="tailLeftGrad" x1="30%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#8C1C30"/>
      <stop offset="35%" stop-color="#6D1324"/>
      <stop offset="75%" stop-color="#400813"/>
      <stop offset="100%" stop-color="#1A0206"/>
    </linearGradient>

    <linearGradient id="tailRightGrad" x1="70%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#8C1C30"/>
      <stop offset="35%" stop-color="#6D1324"/>
      <stop offset="75%" stop-color="#400813"/>
      <stop offset="100%" stop-color="#1A0206"/>
    </linearGradient>

    <linearGradient id="velvetSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E86B82" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#A82840" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F299AA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#801C2F" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- BACK/UPPER LAYER LOOPS -->
    <!-- Back Loop Left Upper -->
    <path d="M 235 200 Q 140 100 65 145 C 10 180 30 255 125 245 C 175 240 220 220 240 210 Z" fill="url(#backLoopLeft)"/>
    <path d="M 235 200 Q 140 100 65 145 C 10 180 30 255 125 245" fill="none" stroke="#D15068" stroke-width="2.5" opacity="0.35"/>

    <!-- Back Loop Left Lower Flare -->
    <path d="M 230 215 C 160 225 35 260 25 320 C 15 375 95 385 180 310 C 215 280 235 240 242 220 Z" fill="url(#backLoopLeft)"/>

    <!-- Back Loop Right Upper -->
    <path d="M 277 200 Q 372 100 447 145 C 502 180 482 255 387 245 C 337 240 292 220 272 210 Z" fill="url(#backLoopRight)"/>
    <path d="M 277 200 Q 372 100 447 145 C 502 180 482 255 387 245" fill="none" stroke="#D15068" stroke-width="2.5" opacity="0.35"/>

    <!-- Back Loop Right Lower Flare -->
    <path d="M 282 215 C 352 225 477 260 487 320 C 497 375 417 385 332 310 C 297 280 277 240 270 220 Z" fill="url(#backLoopRight)"/>

    <!-- RIBBON TAILS WITH FISHTAIL NOTCHES -->
    <!-- Left Ribbon Tail -->
    <g>
      <!-- Base Tail Shape -->
      <path d="M 228 220 C 205 285 155 380 125 480 L 195 435 L 235 480 C 238 390 245 300 248 225 Z" fill="url(#tailLeftGrad)"/>
      <!-- Soft Inner Fold Line -->
      <path d="M 228 220 C 215 285 175 370 155 450 L 195 435 L 210 450 C 225 380 238 290 242 222 Z" fill="url(#velvetSheen)" opacity="0.4"/>
      <!-- Outer Highlight Rim -->
      <path d="M 228 220 C 205 285 155 380 125 480" fill="none" stroke="#E27488" stroke-width="2" opacity="0.4"/>
    </g>

    <!-- Right Ribbon Tail -->
    <g>
      <!-- Base Tail Shape -->
      <path d="M 284 220 C 307 285 357 380 387 480 L 317 435 L 277 480 C 274 390 267 300 264 225 Z" fill="url(#tailRightGrad)"/>
      <!-- Soft Inner Fold Line -->
      <path d="M 284 220 C 297 285 337 370 357 450 L 317 435 L 302 450 C 287 380 274 290 270 222 Z" fill="url(#velvetSheen)" opacity="0.4"/>
      <!-- Outer Highlight Rim -->
      <path d="M 284 220 C 307 285 357 380 387 480" fill="none" stroke="#E27488" stroke-width="2" opacity="0.4"/>
    </g>

    <!-- FRONT MAIN BOW LOOPS -->
    <!-- Left Main Front Loop -->
    <g>
      <path d="M 245 195 C 195 105 90 120 78 200 C 65 290 185 285 248 220 Z" fill="url(#mainLoopLeft)"/>
      <!-- Deep Fold Shadow Inside Loop -->
      <path d="M 245 195 C 200 135 110 145 105 200 C 100 248 185 245 242 215 Z" fill="#28030B" opacity="0.75"/>
      <path d="M 240 200 C 190 150 125 158 120 200 C 115 235 180 230 238 212 Z" fill="url(#mainLoopLeft)"/>
      <!-- Highlight Piping along top curve -->
      <path d="M 245 195 C 195 105 90 120 78 200" fill="none" stroke="#F08CA0" stroke-width="3" opacity="0.5"/>
    </g>

    <!-- Right Main Front Loop -->
    <g>
      <path d="M 267 195 C 317 105 422 120 434 200 C 447 290 327 285 264 220 Z" fill="url(#mainLoopRight)"/>
      <!-- Deep Fold Shadow Inside Loop -->
      <path d="M 267 195 C 312 135 402 145 407 200 C 412 248 327 245 270 215 Z" fill="#28030B" opacity="0.75"/>
      <path d="M 272 200 C 322 150 387 158 392 200 C 397 235 332 230 274 212 Z" fill="url(#mainLoopRight)"/>
      <!-- Highlight Piping along top curve -->
      <path d="M 267 195 C 317 105 422 120 434 200" fill="none" stroke="#F08CA0" stroke-width="3" opacity="0.5"/>
    </g>

    <!-- CENTER KNOT WITH RICH VELVET WRAP AND SHADOWS -->
    <g>
      <!-- Shadow behind Knot -->
      <ellipse cx="256" cy="210" rx="36" ry="28" fill="#140105" opacity="0.9"/>
      <!-- Knot Body -->
      <path d="M 226 182 C 226 172 286 172 286 182 L 290 232 C 290 242 222 242 222 232 Z" fill="url(#knotGlow)"/>
      <!-- Vertical Crease Folds on Knot -->
      <path d="M 238 178 Q 242 207 236 236" fill="none" stroke="#F08CA0" stroke-width="2.5" opacity="0.45"/>
      <path d="M 256 176 Q 259 207 256 238" fill="none" stroke="#F2A0B1" stroke-width="3.5" opacity="0.6"/>
      <path d="M 274 178 Q 270 207 276 236" fill="none" stroke="#2B030A" stroke-width="3" opacity="0.7"/>
      <!-- Horizontal Wrap Stitching Edges -->
      <path d="M 226 182 C 226 172 286 172 286 182" fill="none" stroke="#FFA3B5" stroke-width="2" opacity="0.4"/>
      <path d="M 222 232 C 222 242 290 242 290 232" fill="none" stroke="#2B030A" stroke-width="2.5" opacity="0.8"/>
    </g>
  </g>
</svg>
